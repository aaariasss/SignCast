<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- viewport-fit=cover: la página llena toda la pantalla del iPhone (sin franjas
       negras). maximum-scale y user-scalable evitan que Safari acerque la página. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Traduce Lengua de Señas Mexicana a texto y voz, sin internet.">
  <meta name="theme-color" content="#070B16">

  <!-- iOS meta tags & icons (Agregar a pantalla de inicio) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SignCast">
  <!-- 180x180 es el tamaño que usa el iPhone. Nombre nuevo a propósito: iOS guarda
       el ícono por URL y seguía mostrando uno anterior. -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SignCast</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- MediaPipe web: manos, pose y rostro en el navegador. -->
  <script type="importmap">
    { "imports": { "@litertjs/wasm-utils": "./litert/wasm_utils.js" } }
  </script>
  <script type="module" src="mediapipe/puntos.js"></script>
  <script type="module" src="modelo/modelo.js"></script>
  <!-- Sin internet: sw.js guarda la app, MediaPipe y el modelo.
       Solo funciona con HTTPS (Firebase Hosting) o en localhost. -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker
          .register(new URL('sw.js', document.baseURI).href)
          .catch(function (e) { console.warn('No se pudo registrar sw.js', e); });
        // Pide a Safari que no borre lo guardado cuando el sitio no se usa.
        if (navigator.storage && navigator.storage.persist) {
          navigator.storage.persist().catch(function () {});
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
