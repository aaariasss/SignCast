name: app
description: "SignCast: traduce Lengua de Señas Mexicana a texto y voz, sin internet (app web / PWA)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # Guarda los ajustes (tamaño de letra, voz, tema) en el dispositivo (almacenamiento del navegador).
  shared_preferences: ^2.3.2
  # Voz: en web usa la síntesis de voz del navegador (español de México).
  flutter_tts: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/modelos/
